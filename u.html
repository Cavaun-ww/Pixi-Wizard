<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{site}</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0716">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css?v=20261026-3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=20261026-3"></script>
<script src="app.js?v=20261026-3"></script>
<script src="icons.js?v=20261026-3" defer></script>
<style>
  .prof { text-align: center; padding: 30px 0 34px; }
  .prof .avatar { width: 110px; height: 110px; margin: 0 auto 14px; font-size: 2.6rem; }
  .xp .stats { font-size: .85rem; color: var(--muted); margin-top: -4px; }
  .prof .bio { max-width: 460px; margin: 10px auto 0; color: var(--text-2); }
</style>
</head>
<body>
<main class="wrap wrap-wide">
  <div id="content"><p class="muted" style="text-align:center;padding:60px 0">Loading…</p></div>
</main>
<footer class="footer">Made with <a href="index.html" id="made-with"></a> · <a href="create.html">Create your own AR — first one free</a></footer>

<script>
(async function () {
  App.mountHeader();
  const sb = App.sb, esc = App.esc, $ = (id) => document.getElementById(id);
  $("made-with").textContent = App.C.SITE_NAME;
  const handle = (new URLSearchParams(location.search).get("h") || "").toLowerCase();
  const box = $("content");

  const { data: p } = handle
    ? await sb.from("profiles").select("id, handle, display_name, bio, avatar_path, theme, bg_color, bg_image_path").eq("handle", handle).maybeSingle()
    : { data: null };
  if (!p) {
    box.innerHTML = '<div class="empty"><h2>Page not found</h2><p class="muted" style="margin:8px 0 18px">There\'s no page at this link.</p><a class="btn btn-primary" href="index.html">Go home</a></div>';
    return;
  }

  App.applyTheme(p.theme);
  App.applyBackground(p);
  document.body.classList.add("themed");
  const name = p.display_name || "@" + p.handle;
  document.title = name + " · " + App.C.SITE_NAME;
  const { data: xs } = await sb.from("experiences")
    .select("slug, title, image_path, photo_hidden, created_at, likes(count), comments(count)").eq("owner", p.id).eq("is_private", false).order("created_at", { ascending: false });

  box.innerHTML =
    '<div class="prof">' +
      App.avatarHTML(p) +
      "<h1 style=\"font-size:2rem\">" + esc(name) + "</h1>" +
      '<div class="muted">@' + esc(p.handle) + "</div>" +
      (p.bio ? '<p class="bio">' + esc(p.bio) + "</p>" : "") +
      '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-sm btn-primary" id="msg" hidden>💬 Message</button><button class="btn btn-sm" id="share">Share page</button><button class="btn btn-sm btn-ghost" id="block" hidden>Block</button></div>' +
    "</div>" +
    (xs && xs.length
      ? '<div class="grid">' + xs.map((x) =>
          '<div class="xp">' +
            '<div class="thumb-wrap"><img class="thumb' + (x.photo_hidden ? " blurred" : "") + '" loading="lazy" alt="" src="' + esc(App.publicUrl(x.image_path)) + '">' + (x.photo_hidden ? '<span class="hide-badge">🙈 Find it in person</span>' : "") + "</div>" +
            '<div class="body">' +
              '<div class="title">' + esc(x.title) + "</div>" + (function(x){var l=(x.likes&&x.likes[0]&&x.likes[0].count)||0,c=(x.comments&&x.comments[0]&&x.comments[0].count)||0;return '<div class="stats">♥ '+l+' · 💬 '+c+'</div>';})(x) +
              '<div class="actions"><a class="btn btn-sm btn-primary" href="' + esc(App.arLink(x.slug)) + '">✨ View in AR</a></div>' +
            "</div>" +
          "</div>").join("") + "</div>"
      : '<div class="empty">No AR experiences yet.</div>');

  $("share").onclick = () => App.share(name, location.href);

  // message + block (not on your own page)
  const session = await App.getSession();
  const me = session ? session.user.id : null;
  if (me !== p.id) {
    $("msg").hidden = false;
    $("msg").onclick = () => {
      const to = "messages.html?to=" + encodeURIComponent(p.handle);
      location.href = me ? to : "auth.html?next=" + encodeURIComponent(to);
    };
  }
  if (me && me !== p.id) {
    let blocked = false;
    const { data: b } = await sb.from("blocks").select("blocked").eq("blocker", me).eq("blocked", p.id).maybeSingle();
    const show = () => ($("block").textContent = blocked ? "Unblock" : "Block");
    blocked = !!b; show(); $("block").hidden = false;
    $("block").onclick = async () => {
      if (!blocked && !confirm("Block " + name + "? They won't be able to message you or comment on your posts.")) return;
      const r = blocked
        ? await sb.from("blocks").delete().eq("blocker", me).eq("blocked", p.id)
        : await sb.from("blocks").insert({ blocker: me, blocked: p.id });
      if (r.error) return App.toast("Couldn't update that. Try again.", true);
      blocked = !blocked; show(); App.toast(blocked ? "Blocked" : "Unblocked");
    };
  }
})();
</script>
</body>
</html>
