<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{site}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<style>
  .prof { text-align: center; padding: 30px 0 34px; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; font-size: 2.2rem; font-weight: 500; color: #fff; background: linear-gradient(135deg, var(--accent), #8a5bff); }
  .prof .bio { max-width: 460px; margin: 10px auto 0; color: var(--text-2); }
</style>
</head>
<body>
<main class="wrap wrap-wide">
  <div id="content"><p class="muted" style="text-align:center;padding:60px 0">Loading…</p></div>
</main>
<footer class="footer">Made with <a href="index.html" id="made-with"></a> · <a href="create.html">Create your own AR — first one free</a></footer>

<script>
(async function () {
  App.mountHeader();
  const sb = App.sb, esc = App.esc, $ = (id) => document.getElementById(id);
  $("made-with").textContent = App.C.SITE_NAME;
  const handle = (new URLSearchParams(location.search).get("h") || "").toLowerCase();
  const box = $("content");

  const { data: p } = handle
    ? await sb.from("profiles").select("id, handle, display_name, bio").eq("handle", handle).maybeSingle()
    : { data: null };
  if (!p) {
    box.innerHTML = '<div class="empty"><h2>Page not found</h2><p class="muted" style="margin:8px 0 18px">There\'s no page at this link.</p><a class="btn btn-primary" href="index.html">Go home</a></div>';
    return;
  }

  const name = p.display_name || "@" + p.handle;
  document.title = name + " · " + App.C.SITE_NAME;
  const { data: xs } = await sb.from("experiences")
    .select("slug, title, image_path, created_at").eq("owner", p.id).order("created_at", { ascending: false });

  box.innerHTML =
    '<div class="prof">' +
      '<div class="avatar">' + esc(name.replace("@", "").charAt(0).toUpperCase()) + "</div>" +
      "<h1 style=\"font-size:2rem\">" + esc(name) + "</h1>" +
      '<div class="muted">@' + esc(p.handle) + "</div>" +
      (p.bio ? '<p class="bio">' + esc(p.bio) + "</p>" : "") +
      '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-sm" id="share">Share page</button></div>' +
    "</div>" +
    (xs && xs.length
      ? '<div class="grid">' + xs.map((x) =>
          '<div class="xp">' +
            '<img class="thumb" loading="lazy" alt="" src="' + esc(App.publicUrl(x.image_path)) + '">' +
            '<div class="body">' +
              '<div class="title">' + esc(x.title) + "</div>" +
              '<div class="actions"><a class="btn btn-sm btn-primary" href="' + esc(App.arLink(x.slug)) + '">View in AR</a></div>' +
            "</div>" +
          "</div>").join("") + "</div>"
      : '<div class="empty">No AR experiences yet.</div>');

  $("share").onclick = () => App.share(name, location.href);
})();
</script>
</body>
</html>
