<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore · {site}</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0716">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<style>
  .ex-hero { text-align: center; padding: 26px 0 26px; }
  .ex-hero .lead { max-width: 520px; margin: 10px auto 22px; }
  .xp .by { font-size: 0.85rem; color: var(--muted); }
  .xp .by a { color: var(--text-2); text-decoration: none; }
  .xp .by a:hover { color: var(--accent-2); }
  .thumb-link { display: block; }
  #grid .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  #grid .xp .body { padding: 10px; gap: 6px; }
  #grid .xp .title { font-size: 0.95rem; }
  #grid .xp .thumb { aspect-ratio: 1; }
</style>
</head>
<body>
<main class="wrap wrap-wide">
  <div class="ex-hero">
    <h1>🔮 <span class="magic-text">Explore</span></h1>
    <p class="lead">Every AR photo made with <span class="js-name"></span>. Open the AR camera and point it at any of them to watch it come alive.</p>
    <a class="btn btn-primary btn-lg" href="ar.html?explore=1&go=1">🪄 Open AR camera</a>
  </div>
  <div id="grid"><p class="muted" style="text-align:center;padding:40px 0">Loading…</p></div>
  <div style="text-align:center;margin-top:22px"><button class="btn" id="more" hidden>Load more</button></div>
</main>
<footer class="footer"><a href="index.html">Home</a> · <a href="create.html">Make your own</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer>

<script>
(async function () {
  App.mountHeader();
  const sb = App.sb, esc = App.esc, $ = (id) => document.getElementById(id);
  document.querySelectorAll(".js-name").forEach((e) => (e.textContent = App.C.SITE_NAME));
  const PAGE = 30;
  let from = 0, all = [];

  function card(x) {
    const p = x.profiles || {};
    const who = p.handle
      ? 'by <a href="u.html?h=' + encodeURIComponent(p.handle) + '">' + esc(p.display_name || "@" + p.handle) + "</a>"
      : "";
    return '<div class="xp">' +
      '<a class="thumb-link" href="' + esc(App.arLink(x.slug)) + '"><img class="thumb" loading="lazy" alt="" src="' + esc(App.publicUrl(x.image_path)) + '"></a>' +
      '<div class="body">' +
        '<div class="title">' + esc(x.title) + "</div>" +
        '<div class="by">' + who + "</div>" +
        '<div class="actions"><a class="btn btn-sm btn-primary" href="' + esc(App.arLink(x.slug)) + '">✨ View in AR</a></div>' +
      "</div></div>";
  }

  async function loadPage() {
    $("more").disabled = true;
    const { data, error } = await sb.from("experiences")
      .select("slug, title, image_path, created_at, profiles(handle, display_name)")
      .order("created_at", { ascending: false })
      .range(from, from + PAGE - 1);
    $("more").disabled = false;
    if (error) { $("grid").innerHTML = '<p class="muted" style="text-align:center">' + esc(error.message) + "</p>"; return; }
    all = all.concat(data); from += data.length;
    if (!all.length) {
      $("grid").innerHTML = '<div class="empty"><img src="logo-mark.png" alt="" class="float" style="width:90px;margin:0 auto"><p style="margin:10px 0 16px">No magic here yet. Be the first!</p><a class="btn btn-primary" href="create.html">🪄 Make your first one</a></div>';
      return;
    }
    $("grid").innerHTML = '<div class="grid">' + all.map(card).join("") + "</div>";
    $("more").hidden = data.length < PAGE;
  }
  $("more").onclick = loadPage;
  loadPage();
})();
</script>
</body>
</html>
