<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore · {site}</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0716">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css?v=20261027-6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=20261027-6"></script>
<script src="app.js?v=20261027-6"></script>
<script src="icons.js?v=20261027-6" defer></script>
<style>
  .ex-hero { text-align: center; padding: 26px 0 26px; }
  .ex-hero .lead { max-width: 520px; margin: 10px auto 22px; }
  /* 3-across tile grid (like a video feed) */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 -16px; }
  @media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0; } }
  @media (min-width: 1000px) { .tiles { grid-template-columns: repeat(5, 1fr); } }
  .tile { position: relative; display: block; aspect-ratio: 3 / 4; overflow: hidden; background: #140d26; color: #fff; text-decoration: none; }
  @media (min-width: 700px) { .tile { border-radius: 8px; } }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .tile:hover img { transform: scale(1.04); }
  .tile .shade { position: absolute; inset: auto 0 0 0; padding: 26px 8px 7px; background: linear-gradient(transparent, rgba(0,0,0,.78)); }
  .tile .t { font-size: .82rem; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .tile .b { font-size: .72rem; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .lk { position: absolute; top: 6px; left: 6px; font-size: .7rem; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); }
  .tile .ar { position: absolute; top: 6px; right: 6px; font-size: .7rem; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); }
  .search { position: relative; max-width: 340px; margin: 0 auto 18px; }
  .search input { width: 100%; padding: 9px 38px 9px 38px; border-radius: 999px; border: 1px solid var(--line); background: #140d26; color: var(--text); font: inherit; font-size: 16px; outline: none; }
  .search input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,95,210,.15); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; font-size: .8rem; border-radius: 50%; border: 0; background: #2a2048; color: var(--text-2); cursor: pointer; }
  .near-row { text-align: center; margin: -6px 0 16px; }
  .near-btn { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line); background: #140d26; color: var(--text-2); font: inherit; font-size: .88rem; cursor: pointer; }
  .near-btn:hover { border-color: var(--pink); color: var(--text); }
  .near-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .near-btn.on { border-color: var(--pink); background: #3a1440; color: #fff; }
  .tile .pin { position: absolute; left: 6px; bottom: 44px; font-size: .68rem; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(4px); max-width: calc(100% - 12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .people { max-width: 560px; margin: 0 auto 22px; }
  .people-h { font-family: var(--fun); font-weight: 500; font-size: 1.05rem; margin: 0 0 6px 4px; }
  .person { display: flex; align-items: center; gap: 14px; padding: 9px 6px; border-radius: 14px; text-decoration: none; color: var(--text); }
  .person:hover { background: var(--card); }
  .pav { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--magic); color: #1a0630; font-weight: 600; font-size: 1.2rem; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #ff5fd2; }
  .pav img { width: 100%; height: 100%; object-fit: cover; }
  .pinfo { min-width: 0; display: flex; flex-direction: column; }
  .pinfo b { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pinfo span { font-size: .88rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .people-more { display: block; margin: 6px auto 0; background: none; border: 0; color: var(--accent-2); font: inherit; font-size: .9rem; cursor: pointer; }
  .results-note { text-align: center; color: var(--muted); font-size: .9rem; margin: -8px 0 16px; }
</style>
</head>
<body>
<main class="wrap wrap-wide">
  <div class="ex-hero">
    <h1><span class="magic-text">Explore</span></h1>
    <p class="lead">Every AR photo made with <span class="js-name"></span>. Open the AR camera and point it at any of them to watch it come alive.</p>
    <a class="btn btn-primary btn-lg" href="ar.html?explore=1&go=1">🪄 Open AR camera</a>
  </div>
  <form class="search" id="search-form" role="search" onsubmit="return false">
    <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search">
    <button type="button" class="clear" id="clear" aria-label="Clear search" hidden>✕</button>
  </form>
  <div class="near-row"><button type="button" class="near-btn" id="near">📍 Near me</button><button type="button" class="near-btn" id="liked" hidden>♥ Liked</button></div>
  <div class="people" id="people" hidden></div>
  <p class="results-note" id="note" hidden></p>
  <div id="grid"><p class="muted" style="text-align:center;padding:40px 0">Loading…</p></div>
  <div style="text-align:center;margin-top:22px"><button class="btn" id="more" hidden>Load more</button></div>
</main>
<footer class="footer"><a href="index.html">Home</a> · <a href="create.html">Make your own</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer>

<script>
(async function () {
  App.mountHeader();
  const sb = App.sb, esc = App.esc, $ = (id) => document.getElementById(id);
  document.querySelectorAll(".js-name").forEach((e) => (e.textContent = App.C.SITE_NAME));
  const PAGE = 30;
  const COLS = "slug, title, is_private, image_path, photo_hidden, created_at, lat, lng, profiles!owner(handle, display_name), likes(count), comments(count)";
  let from = 0, all = [];

  const likes = (x) => (x.likes && x.likes[0] && x.likes[0].count) || 0;
  function card(x) {
    const p = x.profiles || {};
    const who = p.handle ? (p.display_name || "@" + p.handle) : "";
    return '<a class="tile" href="' + esc(App.arLink(x.slug)) + '" aria-label="' + esc(x.title) + ' — view in AR">' +
      '<img loading="lazy" alt=""' + (x.photo_hidden ? ' class="blurred"' : "") + ' src="' + esc(App.publicUrl(x.image_path)) + '">' +
      (x.photo_hidden ? '<span class="hide-badge" title="Find it in person">🙈</span>' : "") +
      '<span class="ar">✨ AR</span>' +
      '<span class="lk">♥ ' + likes(x) + " · 💬 " + ((x.comments && x.comments[0] && x.comments[0].count) || 0) + "</span>" +
      (x._dist != null ? '<span class="pin">📍 ' + esc(App.distLabel(x._dist)) + "</span>" : x.lat != null ? '<span class="pin">📍</span>' : "") +
      '<span class="shade"><div class="t">' + esc(x.title) + '</div>' + (who ? '<div class="b">' + esc(who) + "</div>" : "") + "</span>" +
    "</a>";
  }

  // ── search: matches titles, page names and display names ──
  let term = "", ownerIds = [], runId = 0;
  const clean = (t) => t.replace(/[,()*%\\:"]/g, " ").replace(/\s+/g, " ").trim().slice(0, 60);

  async function loadPage() {
    const myRun = runId;
    $("more").disabled = true;
    let q = sb.from("experiences")
      .select(COLS)
      .eq("is_private", false);
    if (term) {
      const ors = ["title.ilike.*" + term + "*", "place_name.ilike.*" + term + "*", "place_area.ilike.*" + term + "*"];
      if (ownerIds.length) ors.push("owner.in.(" + ownerIds.join(",") + ")");
      q = q.or(ors.join(","));
    }
    const { data, error } = await q.order("created_at", { ascending: false }).range(from, from + PAGE - 1);
    if (myRun !== runId) return; // a newer search started — ignore this answer
    $("more").disabled = false;
    if (error) { $("grid").innerHTML = '<p class="muted" style="text-align:center">' + esc(error.message) + "</p>"; return; }
    all = all.concat(data); from += data.length;
    $("note").hidden = !term;
    if (term) $("note").textContent = all.length ? 'Posts matching "' + term + '"' : "";
    if (!all.length && term) {
      $("grid").innerHTML = '<div class="empty"><p style="margin:10px 0 16px">No posts match "' + esc(term) + '" yet.</p><button class="btn" id="clear2">Show everything</button></div>';
      $("clear2").onclick = clearSearch;
      $("more").hidden = true;
      return;
    }
    if (!all.length) {
      $("grid").innerHTML = '<div class="empty"><img src="logo-mark.png" alt="" class="float" style="width:90px;margin:0 auto"><p style="margin:10px 0 16px">No magic here yet. Be the first!</p><a class="btn btn-primary" href="create.html">🪄 Make your first one</a></div>';
      return;
    }
    $("grid").innerHTML = '<div class="tiles">' + all.map(card).join("") + "</div>";
    $("more").hidden = data.length < PAGE;
  }
  $("more").onclick = loadPage;

  // ── ♥ Liked: only appears once you've liked something ──
  let likedOn = false, me = null;
  App.getSession().then(async (s) => {
    if (!s) return;
    me = s.user.id;
    const { count } = await sb.from("likes").select("experience_id", { count: "exact", head: true }).eq("user_id", me);
    if (count > 0) $("liked").hidden = false;
  }).catch(() => {});
  function likedOff() { likedOn = false; $("liked").classList.remove("on"); $("liked").textContent = "♥ Liked"; }
  $("liked").onclick = async () => {
    if (likedOn) { likedOff(); runSearch(); return; }
    if (nearOn) { nearOn = false; $("near").classList.remove("on"); $("near").textContent = "📍 Near me"; }
    $("q").value = ""; $("clear").hidden = true; term = ""; showPeople([]);
    likedOn = true; $("liked").classList.add("on"); $("liked").textContent = "♥ Liked ✕";
    const myRun = ++runId;
    $("more").hidden = true;
    $("grid").innerHTML = '<p class="muted" style="text-align:center;padding:40px 0">Loading your likes…</p>';
    const { data, error } = await sb.from("likes").select("created_at, experiences(" + COLS + ")")
      .eq("user_id", me).order("created_at", { ascending: false }).limit(200);
    if (myRun !== runId) return;
    if (error) { likedOff(); return App.toast("Couldn't load your likes.", true); }
    const rows = (data || []).map((r) => r.experiences).filter((x) => x && !x.is_private);
    $("note").hidden = false;
    $("note").textContent = rows.length ? "Posts you've liked, newest first" : "";
    $("grid").innerHTML = rows.length ? '<div class="tiles">' + rows.map(card).join("") + "</div>"
      : '<div class="empty"><p style="margin:10px 0 6px">No liked posts right now.</p></div>';
  };

  // ── near me: closest AR with a location first ──
  let nearOn = false;
  $("near").onclick = async () => {
    if (likedOn) likedOff();
    if (nearOn) { nearOn = false; $("near").classList.remove("on"); $("near").textContent = "📍 Near me"; runSearch(); return; }
    $("near").disabled = true; $("near").textContent = "Finding you…";
    let me;
    try { me = await App.hereNow(); }
    catch (e) { $("near").disabled = false; $("near").textContent = "📍 Near me"; return App.toast(/blocked/.test(e.message) ? "Location is off for this site. Turn it on in your phone's settings to use Near me." : e.message, true); }
    $("q").value = ""; $("clear").hidden = true; term = ""; showPeople([]);
    $("near").disabled = false;
    const ok = await showNear(me, "Closest to you first");
    if (ok) { nearOn = true; $("near").classList.add("on"); $("near").textContent = "📍 Near me ✕"; }
    else $("near").textContent = "📍 Near me";
  };

  // sort pinned AR by distance from a point (you, or a searched place)
  async function showNear(pt, label) {
    const myRun = ++runId;
    $("grid").innerHTML = '<p class="muted" style="text-align:center;padding:40px 0">Finding nearby AR…</p>';
    const { data, error } = await sb.from("experiences").select(COLS).eq("is_private", false).not("lat", "is", null).limit(500);
    if (myRun !== runId) return false;
    if (error) { App.toast("Couldn't load nearby AR.", true); return false; }
    const rows = (data || []).map((x) => ({ ...x, _dist: App.milesBetween(pt, { lat: x.lat, lng: x.lng }) })).sort((a, b) => a._dist - b._dist);
    $("more").hidden = true;
    $("note").hidden = false;
    $("note").textContent = rows.length ? label + " · only AR with a location" : "";
    $("grid").innerHTML = rows.length
      ? '<div class="tiles">' + rows.map(card).join("") + "</div>"
      : '<div class="empty"><p style="margin:10px 0 6px">No AR pinned on the map yet.</p><p class="muted small">Creators can add a 📍 location when they make one, or later on My page.</p></div>';
    return true;
  }

  async function runSearch() {
    if (likedOn) likedOff();
    if (nearOn) { nearOn = false; $("near").classList.remove("on"); $("near").textContent = "📍 Near me"; }
    term = clean($("q").value);
    $("clear").hidden = !$("q").value;
    const myRun = ++runId;
    from = 0; all = []; ownerIds = [];
    $("grid").innerHTML = '<p class="muted" style="text-align:center;padding:40px 0">' + (term ? "Searching…" : "Loading…") + "</p>";
    $("more").hidden = true;
    if (term) {
      let { data, error } = await sb.from("profiles").select("id, handle, display_name, avatar_path, experiences!owner(count)")
        .not("handle", "is", null)
        .or("handle.ilike.*" + term + "*,display_name.ilike.*" + term + "*")
        .eq("experiences.is_private", false).limit(50);
      if (error) { // fall back to a simpler search so people and posts still show
        console.warn("people search:", error.message);
        ({ data } = await sb.from("profiles").select("id, handle, display_name, avatar_path")
          .not("handle", "is", null).or("handle.ilike.*" + term + "*,display_name.ilike.*" + term + "*").limit(50));
      }
      if (myRun !== runId) return;
      ownerIds = (data || []).map((r) => r.id);
      showPeople(data || []);
    } else showPeople([]);
    loadPage();
  }
  // ── people rows (like Instagram search) ──
  function showPeople(list) {
    const box = $("people");
    const t = term.toLowerCase();
    list = list.slice().sort((a, b) => {
      const sa = (a.handle || "").toLowerCase().startsWith(t) ? 0 : 1, sb2 = (b.handle || "").toLowerCase().startsWith(t) ? 0 : 1;
      return sa - sb2 || ((b.experiences && b.experiences[0] && b.experiences[0].count) || 0) - ((a.experiences && a.experiences[0] && a.experiences[0].count) || 0);
    });
    if (!list.length) { box.hidden = true; box.innerHTML = ""; return; }
    let open = false;
    const render = () => {
      const shown = open ? list : list.slice(0, 4);
      box.innerHTML = '<div class="people-h">People</div>' + shown.map((p) => {
        const n = p.experiences && p.experiences[0] ? p.experiences[0].count : null;
        const name = p.display_name || "";
        const letter = (name || p.handle).charAt(0).toUpperCase();
        return '<a class="person" href="u.html?h=' + encodeURIComponent(p.handle) + '">' +
          '<span class="pav">' + (p.avatar_path ? '<img alt="" src="' + esc(App.publicUrl(p.avatar_path)) + '">' : esc(letter)) + "</span>" +
          '<span class="pinfo"><b data-noicon>' + esc(p.handle) + "</b>" +
          '<span data-noicon>' + [name ? esc(name) : "", n == null ? "" : n + " creation" + (n === 1 ? "" : "s")].filter(Boolean).join(" · ") + "</span></span></a>";
      }).join("") + (list.length > 4 ? '<button type="button" class="people-more" id="people-more">' + (open ? "Show less" : "See all " + list.length + " people") + "</button>" : "");
      const m = $("people-more"); if (m) m.onclick = () => { open = !open; render(); };
    };
    render();
    box.hidden = false;
  }

  function clearSearch() { $("q").value = ""; runSearch(); $("q").focus(); }
  let t;
  $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(runSearch, 300); });
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(t); runSearch(); $("q").blur(); } });
  $("clear").onclick = clearSearch;
  loadPage();
})();
</script>
</body>
</html>
